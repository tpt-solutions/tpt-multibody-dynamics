[package]
name = "tpt-mbd-contact"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Collision detection and contact mechanics for multibody systems"
readme = "README.md"
include = ["LICENSE-MIT", "LICENSE-APACHE", "README.md", "src/**/*"]

[lib]
name = "tpt_mbd_contact"

[dependencies]
tpt-mbd-core = { path = "../tpt-mbd-core", default-features = false }
tpt-math-linalg = { git = "https://github.com/tpt-solutions/tpt-math.git", package = "tpt-math-linalg", default-features = false }
tpt-math-optimize-general = { git = "https://github.com/tpt-solutions/tpt-math.git", package = "tpt-math-optimize-general", default-features = false }
tpt-math-numeric = { git = "https://github.com/tpt-solutions/tpt-math.git", package = "tpt-math-numeric", default-features = false }
tpt-math-spatial = { git = "https://github.com/tpt-solutions/tpt-math.git", package = "tpt-math-spatial", default-features = false }
tpt-math-geometry = { git = "https://github.com/tpt-solutions/tpt-math.git", package = "tpt-math-geometry", default-features = false }

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs", "--generate-link-to-definition"]
