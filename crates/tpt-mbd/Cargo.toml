[package]
name = "tpt-mbd"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Feature-gated umbrella crate re-exporting all multibody dynamics solvers"
readme = "README.md"
include = ["LICENSE-MIT", "LICENSE-APACHE", "README.md", "src/**/*"]

[lib]
name = "tpt_mbd"

[features]
default = []
core = ["tpt-mbd-core"]
kinematics = ["tpt-mbd-kinematics", "tpt-math-geometry"]
joints = ["tpt-mbd-joints"]
contact = ["tpt-mbd-contact"]
flexible = ["tpt-mbd-flexible"]
system = ["tpt-mbd-system"]
render = ["tpt-mbd-system", "gl"]

[dependencies]
tpt-mbd-core = { path = "../tpt-mbd-core", default-features = false, optional = true }
tpt-mbd-kinematics = { path = "../tpt-mbd-kinematics", default-features = false, optional = true }
tpt-mbd-joints = { path = "../tpt-mbd-joints", default-features = false, optional = true }
tpt-mbd-contact = { path = "../tpt-mbd-contact", default-features = false, optional = true }
tpt-mbd-flexible = { path = "../tpt-mbd-flexible", default-features = false, optional = true }
tpt-mbd-system = { path = "../tpt-mbd-system", default-features = false, optional = true }
tpt-math-geometry = { git = "https://github.com/tpt-solutions/tpt-math.git", package = "tpt-math-geometry", default-features = false, optional = true }
tpt-math-linalg-dense = { git = "https://github.com/tpt-solutions/tpt-math.git", package = "tpt-math-linalg-dense", default-features = false, optional = true }
tpt-fem-mesh = { git = "https://github.com/tpt-solutions/tpt-fem.git", package = "tpt-fem-mesh", default-features = false, optional = true }
gl = { version = "0.14", optional = true }

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs", "--generate-link-to-definition"]
