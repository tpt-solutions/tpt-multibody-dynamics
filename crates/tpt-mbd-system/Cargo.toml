[package]
name = "tpt-mbd-system"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
description = "System assembly and time integration for complete multibody simulations"
readme = "README.md"
include = ["LICENSE-MIT", "LICENSE-APACHE", "README.md", "src/**/*"]

[lib]
name = "tpt_mbd_system"

[dependencies]
tpt-mbd-core = { path = "../tpt-mbd-core", default-features = false }
tpt-mbd-kinematics = { path = "../tpt-mbd-kinematics", default-features = false }
tpt-mbd-joints = { path = "../tpt-mbd-joints", default-features = false }
tpt-mbd-contact = { path = "../tpt-mbd-contact", default-features = false }
tpt-mbd-flexible = { path = "../tpt-mbd-flexible", default-features = false }
tpt-math-linalg = { git = "https://github.com/tpt-solutions/tpt-math.git", package = "tpt-math-linalg", default-features = false, features = ["alloc"] }
tpt-math-linalg-dense = { git = "https://github.com/tpt-solutions/tpt-math.git", package = "tpt-math-linalg-dense", default-features = false }
tpt-math-linalg-fixed = { git = "https://github.com/tpt-solutions/tpt-math.git", package = "tpt-math-linalg-fixed", default-features = false }
tpt-math-numeric = { git = "https://github.com/tpt-solutions/tpt-math.git", package = "tpt-math-numeric", default-features = false }
tpt-math-spatial = { git = "https://github.com/tpt-solutions/tpt-math.git", package = "tpt-math-spatial", default-features = false }
rayon = { version = "1", default-features = false }

[dev-dependencies]
tpt-mbd-contact = { path = "../tpt-mbd-contact" }
tpt-mbd-flexible = { path = "../tpt-mbd-flexible" }
tpt-mbd-joints = { path = "../tpt-mbd-joints", default-features = false }
tpt-fem-mesh = { git = "https://github.com/tpt-solutions/tpt-fem.git", package = "tpt-fem-mesh", default-features = false }

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs", "--generate-link-to-definition"]
