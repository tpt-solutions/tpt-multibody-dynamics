[package]
name = "tpt-mbd-flexible"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Flexible multibody dynamics via component mode synthesis (Craig-Bampton)"
readme = "README.md"
include = ["LICENSE-MIT", "LICENSE-APACHE", "README.md", "src/**/*"]

[lib]
name = "tpt_mbd_flexible"

[dependencies]
tpt-mbd-core = { path = "../tpt-mbd-core", default-features = false }
tpt-fem-mesh = { git = "https://github.com/tpt-solutions/tpt-fem.git", package = "tpt-fem-mesh", default-features = false }
tpt-fem-elasticity = { git = "https://github.com/tpt-solutions/tpt-fem.git", package = "tpt-fem-elasticity", default-features = false }
tpt-fem-eigen = { git = "https://github.com/tpt-solutions/tpt-fem.git", package = "tpt-fem-eigen", default-features = false }
tpt-math-linalg-dense = { git = "https://github.com/tpt-solutions/tpt-math.git", package = "tpt-math-linalg-dense", default-features = false }
tpt-math-linalg = { git = "https://github.com/tpt-solutions/tpt-math.git", package = "tpt-math-linalg", default-features = false }
tpt-math-spatial = { git = "https://github.com/tpt-solutions/tpt-math.git", package = "tpt-math-spatial", default-features = false }

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs", "--generate-link-to-definition"]
